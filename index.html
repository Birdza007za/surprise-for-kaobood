<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ถึงข้าวบูด 🌷</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<!-- พื้นหลังเดิม -->
<div class="bg-decor">
  <span class="cloud cloud1"></span>
  <span class="cloud cloud2"></span>

  <span class="sparkle a">✦</span>
  <span class="sparkle b">✧</span>
  <span class="sparkle c">✦</span>
  <span class="sparkle d">·</span>
</div>


<!-- =====================================================
     หน้าเตรียมของพิเศษ
     ===================================================== -->

<div id="introScreen">

  <div class="intro-card">

    <div class="intro-title">
      รอแปปน้าา 💙
    </div>

    <div class="intro-message">
      กำลังเตรียมของพิเศษให้อยู่<br>
      ขอเวลาสักแปปนึงน้าา
    </div>

    <!-- หลอดโหลด -->
    <div class="loading-box">
      <div id="loadingBar"></div>
    </div>

    <div id="loadingText">
      กำลังเตรียมของพิเศษ... 0%
    </div>

    <!-- ปุ่มโมมงกะ -->
    <div class="intro-button-wrap">
  <span class="intro-sparkle s1">✦</span>
  <span class="intro-sparkle s2">✧</span>
  <span class="intro-sparkle s3">✦</span>
  <span class="intro-sparkle s4">✧</span>
  <span class="intro-sparkle s5">✦</span>
  <span class="intro-sparkle s6">·</span>

  <button id="introNext" class="intro-next">
    <img src="assets/go-button.png" alt="ไปต่อ">
  </button>
</div>

  </div>

</div>


<!-- =====================================================
     เว็บหลักเดิม
     ===================================================== -->

<main id="app"></main>

<div id="particles"></div>


<script src="script.js"></script>

</body>
</html>
